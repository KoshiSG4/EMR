name: CI

on:
    push:
        branches: ['main', 'develop']
    pull_request:
        branches: ['main', 'develop']

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15
                ports: ['5432:5432']
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: emr_test
                options: >-
                    --health-cmd="pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install backend
              working-directory: ./server
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emr_test
              run: |
                  npm install
                  npx prisma migrate deploy
                  npm run build
                  npm test --if-present

            - name: Install frontend
              working-directory: ./client
              run: |
                  npm install
                  npm run build
